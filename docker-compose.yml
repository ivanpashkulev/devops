services:
  web:
    image: ghcr.io/ivanpashkulev/web-main:b59a39e271dd287d41ac356b4d59c419dfb9fecb
    container_name: web-main
    restart: unless-stopped
    environment:
      - VITE_API_URL=/api
    depends_on:
      - api

  api:
    image: ghcr.io/ivanpashkulev/api-main:2491fbf
    container_name: api-main
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
    volumes:
      - ./assets:/app/assets

  dj:
    image: ghcr.io/ivanpashkulev/dj:08154664c77dd150650ba1035b53f0e51f01b78f
    container_name: dj
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
      - dj
    restart: unless-stopped
