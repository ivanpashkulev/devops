services:
  web:
    image: ghcr.io/ivanpashkulev/web-main:97a7ef2569a46bf6f468d822331fd2de7ed11133
    container_name: web-main
    restart: unless-stopped
    environment:
      - VITE_API_URL=/api
    depends_on:
      - api

  api:
    image: ghcr.io/ivanpashkulev/api-main:22e611c547551d263ab5c14be93c783d7b154c5e
    container_name: api-main
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:?OPENAI_MAX_OUTPUT_TOKENS is required}
      CHAT_RATE_LIMIT_PER_DAY: ${CHAT_RATE_LIMIT_PER_DAY:?CHAT_RATE_LIMIT_PER_DAY is required}
      CHAT_MAX_MESSAGE_CHARACTERS: ${CHAT_MAX_MESSAGE_CHARACTERS:?CHAT_MAX_MESSAGE_CHARACTERS is required}
      CHAT_MAX_HISTORY_CHARACTERS: ${CHAT_MAX_HISTORY_CHARACTERS:?CHAT_MAX_HISTORY_CHARACTERS is required}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:8.10.1-alpine
    container_name: redis
    command: redis-server --save "" --appendonly no
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  dj:
    image: ghcr.io/ivanpashkulev/dj:93fbb061810f2c9299264d03b5e2c93129ca214c
    container_name: dj
    restart: unless-stopped

  nginx:
    image: nginx:1.30.4-alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: /etc/nginx/ssl
        target: /etc/nginx/ssl
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - web
      - api
      - dj
    restart: unless-stopped
