services:
  web:
    image: ghcr.io/ivanpashkulev/web-main:c1bb9c5c96550d020ab84c6901178753ca3cbf23
    container_name: web-main
    restart: unless-stopped
    environment:
      - VITE_API_URL=/api
    depends_on:
      - api

  api:
    image: ghcr.io/ivanpashkulev/api-main:2491fbf
    container_name: api-main
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
    volumes:
      - ./assets:/app/assets

  dj:
    image: ghcr.io/ivanpashkulev/dj:436b8e747e59128e4e2949f10c1a5d90d21d76ee
    container_name: dj
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
      - dj
    restart: unless-stopped
