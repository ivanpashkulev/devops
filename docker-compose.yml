services:
  web:
    image: ghcr.io/ivanpashkulev/web-main:b59a39e271dd287d41ac356b4d59c419dfb9fecb
    container_name: web-main
    restart: unless-stopped
    environment:
      - VITE_API_URL=/api
    depends_on:
      - api

  api:
    image: ghcr.io/ivanpashkulev/api-main:658b6903c3adc99b5c47c17270d3c3500f7334de
    container_name: api-main
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
    volumes:
      - ./assets:/app/assets

  dj:
    image: ghcr.io/ivanpashkulev/dj:93fbb061810f2c9299264d03b5e2c93129ca214c
    container_name: dj
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
      - dj
    restart: unless-stopped
