name: Hetzner Terraform
description: Set up Terraform, authenticate the state backend and execute Terraform.

inputs:
  action:
    description: Terraform operation, Provision or Destroy.
    required: true
  should_apply:
    description: Whether to apply the generated plan.
    required: true
  terraform_version:
    description: Exact Terraform version.
    required: true
  aws_role_to_assume:
    description: AWS role for accessing Terraform state.
    required: true

runs:
  using: composite
  steps:
    - name: Validate Terraform version
      shell: bash
      env:
        TERRAFORM_VERSION: ${{ inputs.terraform_version }}
      run: |
        if [[ ! "$TERRAFORM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Set TERRAFORM_VERSION to an exact release version, for example 1.15.8."
          exit 1
        fi

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ inputs.terraform_version }}

    - name: Authenticate AWS state backend
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.aws_role_to_assume }}
        aws-region: eu-central-1

    - name: Execute Terraform ${{ inputs.action }}
      uses: pashkulev-devops-projects/github-actions/actions/terraform@49a95e243c794eb06e15c97924812fbdc7be1b0a
      with:
        working_directory: terraform/hetzner
        action: ${{ inputs.action }}
        should_apply: ${{ inputs.should_apply }}
