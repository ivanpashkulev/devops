name: Provision and configure Hetzner

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform operation
        required: true
        default: Provision
        type: choice
        options:
          - Provision
          - Destroy

      should_apply:
        description: Apply the generated Terraform plan?
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: terraform-hetzner-ivanpashkulev-com
  cancel-in-progress: false

jobs:
  terraform-quality:
    name: Terraform quality and security checks
    uses: pashkulev-devops-projects/github-actions/.github/workflows/terraform-quality.yml@fba02608b604b8b642a1ba3440e0aa34e2b27be0
    with:
      project_paths: '["terraform/hetzner"]'

  provision-and-configure-hetzner:
    name: Hetzner infrastructure and application setup
    needs: terraform-quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Execute Terraform ${{ inputs.action }}
        uses: ./.github/actions/terraform
        with:
          action: ${{ inputs.action }}
          should_apply: ${{ toJSON(inputs.should_apply) }}
          terraform_version: ${{ vars.TERRAFORM_VERSION }}
          aws_role_to_assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        env:
          HCLOUD_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_ansible_server_public_ssh_key: ${{ secrets.ANSIBLE_SERVER_PUBLIC_SSH_KEY }}
          TF_VAR_gh_actions_public_ssh_key: ${{ secrets.GH_ACTIONS_PUBLIC_SSH_KEY }}
          TF_VAR_allowed_ssh_ips: ${{ vars.ALLOWED_SSH_IPS }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}

      - name: Authenticate bootstrap GitHub App
        if: ${{ inputs.action == 'Provision' && inputs.should_apply }}
        id: bootstrap-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOOTSTRAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOOTSTRAP_APP_PRIVATE_KEY }}
          permission-secrets: write

      - name: Bootstrap runner WireGuard key
        if: ${{ inputs.action == 'Provision' && inputs.should_apply }}
        id: wireguard-bootstrap
        uses: pashkulev-devops-projects/github-actions/actions/wireguard/key-bootstrap@5127817c7871db733c504170abca25962a693385
        with:
          github_token: ${{ steps.bootstrap-token.outputs.token }}
          private_key: ${{ secrets.WIREGUARD_RUNNER_PRIVATE_KEY }}

      - name: Configure and deploy applications
        if: ${{ inputs.action == 'Provision' && inputs.should_apply }}
        uses: ./.github/actions/ansible
        with:
          playbook: ansible/deploy.yml
          ssh_private_key: ${{ secrets.GH_ACTIONS_PRIVATE_SSH_KEY }}
        env:
          HCLOUD_TOKEN: ${{ secrets.HETZNER_INVENTORY_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_ORIGIN_CERT: ${{ secrets.CLOUDFLARE_ORIGIN_CERT }}
          CLOUDFLARE_ORIGIN_KEY: ${{ secrets.CLOUDFLARE_ORIGIN_KEY }}
          WIREGUARD_RUNNER_PUBLIC_KEY: ${{ steps.wireguard-bootstrap.outputs.public_key }}

      - name: Store WireGuard server public key
        if: ${{ inputs.action == 'Provision' && inputs.should_apply }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bootstrap-token.outputs.token }}
        run: |
          gh secret set WIREGUARD_SERVER_PUBLIC_KEY \
            --repo "$GITHUB_REPOSITORY" \
            < "$RUNNER_TEMP/wireguard-server-public-key"

      - name: Read WireGuard connection details
        if: ${{ inputs.action == 'Provision' && inputs.should_apply }}
        id: wireguard-server
        shell: bash
        run: |
          IFS= read -r server_public_key \
            < "$RUNNER_TEMP/wireguard-server-public-key"

          server_endpoint=$(
            terraform -chdir=terraform/hetzner \
              output -raw wireguard_server_endpoint
          )

          printf 'server_public_key=%s\n' "$server_public_key" >> "$GITHUB_OUTPUT"
          printf 'server_endpoint=%s\n' "$server_endpoint" >> "$GITHUB_OUTPUT"

      - name: Connect runner to WireGuard
        if: ${{ inputs.action == 'Provision' && inputs.should_apply }}
        id: wireguard-connect
        uses: pashkulev-devops-projects/github-actions/actions/wireguard/connect@5127817c7871db733c504170abca25962a693385
        with:
          private_key: ${{ secrets.WIREGUARD_RUNNER_PRIVATE_KEY }}
          server_public_key: ${{ steps.wireguard-server.outputs.server_public_key }}
          server_endpoint: ${{ steps.wireguard-server.outputs.server_endpoint }}

      - name: Configure WireGuard SSH verification key
        if: ${{ inputs.action == 'Provision' && inputs.should_apply }}
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GH_ACTIONS_PRIVATE_SSH_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$RUNNER_TEMP/wireguard-ssh-key"

      - name: Verify SSH over WireGuard
        if: ${{ inputs.action == 'Provision' && inputs.should_apply }}
        shell: bash
        run: |
          ssh \
            -i "$RUNNER_TEMP/wireguard-ssh-key" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$RUNNER_TEMP/wireguard-known-hosts" \
            root@10.100.0.1 \
            hostname

      - name: Remove WireGuard SSH verification files
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f -- \
            "$RUNNER_TEMP/wireguard-ssh-key" \
            "$RUNNER_TEMP/wireguard-known-hosts"

      - name: Disconnect runner from WireGuard
        if: ${{ always() && inputs.action == 'Provision' && inputs.should_apply }}
        shell: bash
        run: |
          if sudo wg show wg0 > /dev/null 2>&1; then
            sudo wg-quick down "$RUNNER_TEMP/wg0.conf"
          fi

          rm -f -- "$RUNNER_TEMP/wg0.conf"
