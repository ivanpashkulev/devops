name: Validate deployment manifest

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-compose:
    name: Validate Docker Compose configuration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        env:
          OPENAI_API_KEY: validation-only
          OPENAI_MAX_OUTPUT_TOKENS: "300"
          CHAT_RATE_LIMIT_PER_DAY: "10"
          CHAT_MAX_MESSAGE_CHARACTERS: "1000"
          CHAT_MAX_HISTORY_CHARACTERS: "4000"
          TURNSTILE_SECRET_KEY: validation-only
          TURNSTILE_SITE_KEY: validation-only
        run: docker compose config --quiet
