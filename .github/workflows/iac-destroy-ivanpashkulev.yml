name: IaC Destroy ivanpashkulev

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hetzner-ivanpashkulev-com
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy Hetzner infrastructure
    uses: ./.github/workflows/hetzner-terraform.yml
    with:
      action: Destroy
      should_apply: true
    secrets:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ANSIBLE_SERVER_PUBLIC_SSH_KEY: ${{ secrets.ANSIBLE_SERVER_PUBLIC_SSH_KEY }}
      GH_ACTIONS_PUBLIC_SSH_KEY: ${{ secrets.GH_ACTIONS_PUBLIC_SSH_KEY }}
    permissions:
      contents: read
      id-token: write
