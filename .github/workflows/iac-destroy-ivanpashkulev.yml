name: IaC Destroy ivanpashkulev on Hetzner

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hetzner-ivanpashkulev-com
  cancel-in-progress: false

jobs:
  destroy-azure-runtime:
    name: Destroy Azure runtime
    uses: ./.github/workflows/azure-terraform.yml
    with:
      working_directory: terraform/azure-runtime
      action: Destroy
      should_apply: true
    permissions:
      contents: read
      id-token: write

  delete-azure-arc-resource:
    name: Delete server Azure Arc resource
    needs: destroy-azure-runtime
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve server endpoint
        id: server
        shell: bash
        env:
          HCLOUD_TOKEN: ${{ secrets.HETZNER_INVENTORY_TOKEN }}
        run: bash .github/scripts/resolve-hetzner-server-endpoint.sh

      - name: Authenticate Azure through OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_GH_ACTIONS_TF_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Delete Azure Arc resource when it exists
        shell: bash
        run: |
          resource_id="$(
            az connectedmachine list \
              --resource-group ivanpashkulev-prod-rg \
              --query "[?name=='ivanpashkulev-prod-server'].id | [0]" \
              --output tsv \
              --only-show-errors
          )"

          if [[ -n "$resource_id" ]]; then
            az connectedmachine delete \
              --ids "$resource_id" \
              --yes \
              --only-show-errors
          fi

      - name: Remove server access from Key Vault
        if: ${{ steps.server.outputs.endpoint != '' }}
        shell: bash
        run: |
          az keyvault network-rule remove \
            --resource-group ivanpashkulev-prod-rg \
            --name ivanpashkulev-prod-kv \
            --ip-address "${{ steps.server.outputs.endpoint }}" \
            --only-show-errors

  destroy:
    name: Destroy Hetzner infrastructure
    needs: delete-azure-arc-resource
    uses: ./.github/workflows/hetzner-terraform.yml
    with:
      action: Destroy
      should_apply: true
    secrets:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ANSIBLE_SERVER_PUBLIC_SSH_KEY: ${{ secrets.ANSIBLE_SERVER_PUBLIC_SSH_KEY }}
      GH_ACTIONS_PUBLIC_SSH_KEY: ${{ secrets.GH_ACTIONS_PUBLIC_SSH_KEY }}
    permissions:
      contents: read
      id-token: write

  remove-wireguard-server-public-key:
    name: Remove WireGuard server public key
    needs: destroy
    runs-on: ubuntu-26.04

    steps:
      - name: Authenticate ivanpashkulev-devops-bootstrap GitHub App
        id: bootstrap-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOOTSTRAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOOTSTRAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Delete WireGuard server public key
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bootstrap-token.outputs.token }}
        run: |
          if gh secret list \
            --repo "$GITHUB_REPOSITORY" \
            --json name \
            --jq '.[].name' \
            | grep --fixed-strings --line-regexp 'WIREGUARD_SERVER_PUBLIC_KEY' > /dev/null; then
            gh secret delete WIREGUARD_SERVER_PUBLIC_KEY \
              --repo "$GITHUB_REPOSITORY"
          fi
