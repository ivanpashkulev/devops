name: Build, publish and create image update PR

on:
  workflow_call:
    secrets:
      DEVOPS_TOKEN:
        required: true

jobs:
  build-and-publish:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      service: ${{ steps.metadata.outputs.service }}
      short-sha: ${{ steps.metadata.outputs.short-sha }}

    steps:
      - uses: actions/checkout@v7

      - name: Set image metadata
        id: metadata
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "service=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
          echo "short-sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-devops:
    name: Create image update PR
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: ${{ needs.build-and-publish.outputs.image }}
      SERVICE: ${{ needs.build-and-publish.outputs.service }}
      SHORT_SHA: ${{ needs.build-and-publish.outputs.short-sha }}
      TAG: ${{ github.sha }}

    steps:
      - name: Check out devops
        uses: actions/checkout@v7
        with:
          repository: ivanpashkulev/devops
          token: ${{ secrets.DEVOPS_TOKEN }}

      - name: Update image tag
        run: |
          EXPECTED_IMAGE="${IMAGE}:${TAG}"

          echo "Updating ${IMAGE} in docker-compose.yml"
          sed -i "s|image: ${IMAGE}:.*|image: ${EXPECTED_IMAGE}|" docker-compose.yml

          # Verify that sed produced the expected image reference.
          if ! grep -Fq "image: ${EXPECTED_IMAGE}" docker-compose.yml; then
            echo "::error::Failed to update ${IMAGE} in docker-compose.yml"
            exit 1
          fi

          echo "Updated image to ${EXPECTED_IMAGE}"

      - name: Create deployment PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DEVOPS_TOKEN }}
          add-paths: docker-compose.yml
          branch: deploy/${{ env.SERVICE }}
          delete-branch: true
          commit-message: "deploy: ${{ env.SERVICE }} -> ${{ env.SHORT_SHA }}"
          title: "deploy: ${{ env.SERVICE }} -> ${{ env.SHORT_SHA }}"
          body: |
            Automated deployment image update.

            **Image:** `${{ env.IMAGE }}:${{ env.TAG }}`
            **Source:** `${{ github.repository }}@${{ env.TAG }}`
