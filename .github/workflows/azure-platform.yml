name: IaC Azure for ivanpashkulev.com

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform operation
        required: true
        default: Provision
        type: choice
        options:
          - Provision
          - Destroy

      should_apply:
        description: Apply the generated Terraform plan?
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: azure-platform-ivanpashkulev-com
  cancel-in-progress: false

jobs:
  terraform:
    name: ${{ inputs.action }} Azure infrastructure
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_GH_ACTIONS_TF_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_azure_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_azure_admin_object_id: ${{ vars.AZURE_ADMIN_OBJECT_ID }}
      TF_VAR_key_vault_allowed_ip_addresses: ${{ vars.ALLOWED_SSH_IPS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Authenticate Azure through OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_GH_ACTIONS_TF_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Execute Terraform ${{ inputs.action }}
        uses: pashkulev-devops-projects/github-actions/actions/terraform@508d9cc538b84adeb6744dab7b523093db38645b
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}
          working_directory: terraform/azure-platform
          action: ${{ inputs.action }}
          should_apply: ${{ toJSON(inputs.should_apply) }}

  publish-configuration:
    name: Publish Azure configuration
    needs: terraform
    if: ${{ inputs.action == 'Provision' && inputs.should_apply }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-azure-configuration.yml
    secrets: inherit
