name: IaC Azure for ivanpashkulev.com

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform operation
        required: true
        default: Provision
        type: choice
        options:
          - Provision
          - Destroy

      should_apply:
        description: Apply the generated Terraform plan?
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: azure-platform-ivanpashkulev-com
  cancel-in-progress: false

jobs:
  terraform:
    name: ${{ inputs.action }} Azure infrastructure
    uses: ./.github/workflows/azure-terraform.yml
    with:
      working_directory: terraform/azure-platform
      action: ${{ inputs.action }}
      should_apply: ${{ inputs.should_apply }}
      azure_location: ${{ vars.AZURE_LOCATION }}
      azure_admin_object_id: ${{ vars.AZURE_ADMIN_OBJECT_ID }}
      key_vault_allowed_ip_addresses: ${{ vars.ALLOWED_SSH_IPS }}
    permissions:
      contents: read
      id-token: write

  publish-configuration:
    name: Publish Azure configuration
    needs: terraform
    if: ${{ inputs.action == 'Provision' && inputs.should_apply }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-azure-configuration.yml
    secrets: inherit
