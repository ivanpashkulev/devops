---
- name: Validate deployment targets
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Require exactly one Hetzner target
      ansible.builtin.assert:
        that:
          - groups.get('hetzner', []) | length == 1
        fail_msg: WireGuard setup currently requires exactly one Hetzner server.

    - name: Require WireGuard runner public key
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'WIREGUARD_RUNNER_PUBLIC_KEY')  | trim | length > 0
        fail_msg: WIREGUARD_RUNNER_PUBLIC_KEY is required.

- name: Deploy applications on Hetzner
  hosts: hetzner
  remote_user: root
  gather_facts: false

  tasks:
    - name: Wait for SSH readiness on the Terraform-provisioned VM
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Wait for initial server setup
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    - name: Configure WireGuard server
      ansible.builtin.include_role:
        name: pashkulev.infrastructure.wireguard_server
      vars:
        wireguard_server_address: 10.100.0.1/24
        wireguard_listen_port: 51820
        wireguard_peers:
          - public_key: "{{ lookup('ansible.builtin.env', 'WIREGUARD_RUNNER_PUBLIC_KEY') }}"
            allowed_ips:
              - 10.100.0.2/32

    - name: Return WireGuard server public key to the workflow
      ansible.builtin.copy:
        content: "{{ wireguard_server_public_key }}\n"
        dest: "{{ lookup('ansible.builtin.env', 'RUNNER_TEMP') }}/wireguard-server-public-key"
        mode: "0600"
      delegate_to: localhost
      changed_when: false

    - name: Install Docker and Compose
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true

    - name: Start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create application directory
      ansible.builtin.file:
        path: /opt/ivanpashkulev/nginx
        state: directory
        mode: "0755"

    - name: Copy Compose file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker-compose.yml"
        dest: /opt/ivanpashkulev/docker-compose.yml
        mode: "0644"

    - name: Copy Nginx configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../nginx/nginx.conf"
        dest: /opt/ivanpashkulev/nginx/nginx.conf
        mode: "0644"

    - name: Create certificate directory
      ansible.builtin.file:
        path: /etc/nginx/ssl
        state: directory
        mode: "0700"

    - name: Copy Cloudflare certificate
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.env', 'CLOUDFLARE_ORIGIN_CERT') }}"
        dest: /etc/nginx/ssl/cloudflare-origin.crt
        mode: "0644"
      no_log: true

    - name: Copy Cloudflare private key
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.env', 'CLOUDFLARE_ORIGIN_KEY') }}"
        dest: /etc/nginx/ssl/cloudflare-origin.key
        mode: "0600"
      no_log: true

    - name: Pull application images
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: /opt/ivanpashkulev
      environment:
        OPENAI_API_KEY: "{{ lookup('ansible.builtin.env', 'OPENAI_API_KEY') }}"
      no_log: true

    - name: Start application containers
      ansible.builtin.command:
        cmd: docker compose up -d --force-recreate
        chdir: /opt/ivanpashkulev
      environment:
        OPENAI_API_KEY: "{{ lookup('ansible.builtin.env', 'OPENAI_API_KEY') }}"
      no_log: true
